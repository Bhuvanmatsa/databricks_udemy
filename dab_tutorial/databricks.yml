# This is a Databricks asset bundle definition for dab_tutorial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_tutorial
  uuid: 0b967fa0-3e2c-412a-ac34-6dbe31e6f4e3

include:

  - resources/**/*.yaml
  - resources/**/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: dbc-f0273b7b-9915.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
    presets:
      name_prefix: ${workspace.current_user.short_name}
      source_linked_deployment: false
    permissions:
      - group_name: admins
        level : CAN_MANAGE
        

    
  prod:
    mode: production
    workspace:
      host: dbc-f0273b7b-9915.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/bhuvanesh093@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: bhuvanesh093@gmail.com
        level : CAN_MANAGE
      - group_name: admins
        level: CAN_RUN
